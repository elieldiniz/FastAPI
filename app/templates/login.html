{% extends "base.html" %}

{% block title %}Login - Retro Tech Blog{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 30px;">Access Archive</h2>

        {% if error %}
        <p style="color: var(--error-color); background: #fdf2f2; padding: 10px; border-radius: 4px; font-size: 0.9rem; text-align: center;">{{ error }}</p>
        {% endif %}

        <form action="/login" method="post">
            <div>
                <label for="username">Archive Identity (Email)</label>
                <input type="email" id="username" name="username" required placeholder="user@network.archive">
            </div>
            <div>
                <label for="password">Access Key</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">INITIALIZE SESSION</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
