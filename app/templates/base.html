<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini Blog{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <a href="/" class="header-logo">RETRO <span>TECH</span></a>

                <div class="header-actions">
                    <div class="search-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>

                    {% if user %}
                    <a href="/profile" class="user-profile">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ user.email }}" alt="User Avatar" class="avatar">
                        <div class="status-indicator"></div>
                    </a>
                    {% else %}
                    <a href="/login" class="btn btn-primary" style="padding: 5px 15px; font-size: 0.8rem;">LOGIN</a>
                    {% endif %}
                </div>
            </div>

            <nav class="header-bottom">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Home</a>
                <a href="/posts" class="nav-link {% if request.url.path.startswith('/posts') %}active{% endif %}">Posts</a>
                {% if user and user.role == 'admin' %}
                <a href="/dashboard" class="nav-link {% if request.url.path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
                {% endif %}
                {% if user %}
                <a href="/profile" class="nav-link {% if request.url.path == '/profile' %}active{% endif %}">Profile</a>
                <a href="/logout" class="nav-link" style="margin-left: auto; opacity: 0.5;">Logout</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Retro Tech Blog. Powered by FastAPI.</p>
        </div>
    </footer>
</body>
</html>
